config-version = 2

after-startup-command = ['exec-and-forget borders']
start-at-login = true
auto-reload-config = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focus-changed = 'move-mouse window-lazy-center'
key-mapping.preset = 'qwerty'
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ['1','2','3','4','5','6','7','8']

accordion-padding = 16
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 8
gaps.outer.right = 8

workspace-to-monitor-force-assignment.3 = 'secondary'
workspace-to-monitor-force-assignment.7 = 'secondary'

on-window-detected = [
    {
        if = 'test %{app-name} ~= mpv || test %{app-name} ~= java || test %{app-bundle-id} = com.apple.QuickTimePlayerX || test %{app-bundle-id} = com.apple.FaceTime',
        run = 'layout floating',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.hnc.Discord || test %{app-bundle-id} = com.valvesoftware.steam',
        run = 'move-node-to-workspace 1',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = md.obsidian',
        run = 'move-node-to-workspace 2',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.apple.mail || test %{app-bundle-id} = com.apple.iCal || test %{app-bundle-id} = com.apple.Safari || test %{app-bundle-id} = com.apple.Maps',
        run = 'move-node-to-workspace 3',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.apple.Photos',
        run = 'move-node-to-workspace 4',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = app.zen-browser.zen || test %{app-bundle-id} = com.vivaldi.Vivaldi',
        run = 'move-node-to-workspace 5',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.mitchellh.ghostty || test %{app-bundle-id} = dev.zed.Zed',
        run = 'move-node-to-workspace 6',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.apple.MobileSMS || test %{app-bundle-id} = com.apple.Music || test %{app-bundle-id} = com.apple.podcasts',
        run = 'move-node-to-workspace 7',
        check-further-callbacks = true,
    },
    {
        if = 'test %{app-bundle-id} = com.mgsdevelopment.forscore || test %{app-bundle-id} = milesvinson.Andante || test %{app-bundle-id} = com.apple.logic10 || test %{app-bundle-id} = com.apple.FinalCut',
        run = 'move-node-to-workspace 8',
        check-further-callbacks = true,
    },
]

[mode.main.binding]
alt-slash = 'layout h_tiles v_tiles'
alt-comma = 'layout v_accordion'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-f = 'fullscreen'

alt-w = 'workspace 1'
alt-e = 'workspace 2'
alt-r = 'workspace 3'
alt-t = 'workspace 4'
alt-y = 'workspace 5'
alt-u = 'workspace 6'
alt-i = 'workspace 7'
alt-o = 'workspace 8'

alt-shift-w = 'move-node-to-workspace 1'
alt-shift-e = 'move-node-to-workspace 2'
alt-shift-r = 'move-node-to-workspace 3'
alt-shift-t = 'move-node-to-workspace 4'
alt-shift-y = 'move-node-to-workspace 5'
alt-shift-u = 'move-node-to-workspace 6'
alt-shift-i = 'move-node-to-workspace 7'
alt-shift-o = 'move-node-to-workspace 8'