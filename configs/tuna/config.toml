[settings]
activationDoublePressTrigger = 'leftCommand'
appPresentationMode = 'never'
catalogPeriodicRescanIntervalMinutes = 60
comboModeCheatsheetBehavior = 'never'
comboModeCheatsheetShowDetails = false
comboModeCheatsheetShowIcons = false
comboModeModifierConfiguration = 'optionGroupControlSticky'
comboModeModifierTrigger = 'rightCommand'
fuzzyModeTriggerType = 'doublePress'
shelfCatalogEnabled = false
shelfWindowAlwaysOnTop = false
shortcutDisplayUsesHyperSymbol = false
showTasksIndicatorWhenHidden = false
talkModeTriggerType = 'disabled'
textModeTriggerType = 'disabled'
themeIdentifier = 'com.brnbw.tuna.themes.default'
typingTimeoutDuration = 3.0

[smartLinks]
entries = []

